<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>게시글 가져오기 - ID 입력</title>
</head>
<body>
  <h1>3단계:게시글 불러오기</h1>

  <label for="postId">게시글 ID 입력: </label>
  <input type="number" id="postId" placeholder="예: 1" />
  <button onclick="fetchPost()">게시글 가져오기</button>

  <h2 id="title"></h2>
  <p id="body"></p>

  <script>
    function fetchPost() {
      const id = document.getElementById('postId').value;

      if (!id || Number(id) <= 0) {
        document.getElementById('title').textContent = '! 유효한 ID를 입력하세요.';
        document.getElementById('body').textContent = '';
        return;
      }

      fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
        .then(response => response.json())
        .then(data => {
          document.getElementById('title').textContent = data.title;
          document.getElementById('body').textContent = data.body;
        });
    }
  </script>
</body>
</html>
