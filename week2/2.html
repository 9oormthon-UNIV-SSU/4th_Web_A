<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2.html</title>
</head>
<body>
  <h2>2단계 : 게시글 불러오기</h2>
  <input type="number" id="post-id" placeholder="게시글 ID 입력">
  <button onclick="fetchPost()">게시글 불러오기</button>
  <h3 id="post-title">제목 출력 영역</h3>
  <p id="post-body">내용 출력 영역</p>

  <script>
    function fetchPost() {
      const id = document.getElementById('post-id').value;

      fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
        .then(response => response.json())
        .then(data => {
          document.getElementById('post-title').textContent = data.title;
          document.getElementById('post-body').textContent = data.body;
        });
    }
  </script>
</body>
</html>
