<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3.html</title>
  <style>
    #error-msg {
      color: rgb(111, 237, 197);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>3단계 : 게시글 불러오기</h2>

  <input type="number" id="post-id" placeholder="게시글 ID 입력">
  <button onclick="fetchPost()">게시글 불러오기</button>

  <p id="error-msg"></p>

  <h3 id="post-title">제목 출력 영역</h3>
  <p id="post-body">내용 출력 영역</p>

  <script>
    function fetchPost() {
      const id = document.getElementById('post-id').value.trim();
      const errorMsg = document.getElementById('error-msg');
      const title = document.getElementById('post-title');
      const body = document.getElementById('post-body');

      errorMsg.textContent = '';
      title.textContent = '';
      body.textContent = '';

      if (!id || isNaN(id) || Number(id) <= 0) {
        errorMsg.textContent = '유효한 숫자 ID를 입력해주세요.';
        return;
      }

      fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
        .then(response => response.json())
        .then(data => {
          title.textContent = data.title;
          body.textContent = data.body;
        });
    }
  </script>
</body>
</html>
