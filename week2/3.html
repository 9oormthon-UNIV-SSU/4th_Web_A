<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week2_3</title>
</head>
<body>
    <h1>
        3단계 : 게시글 불러오기
    </h1>

    <div>
        <input id ="postID" type ="text" placeholder="Post ID입력(예: 1)">
        <button id = "get" onclick = "getInfo();">게시글 불러오기</button>
        <h2 id = "Title"></h2>
        <p id = "Body"></p>
        <p id = "error" style = "color :red"></p>
    </div>

    <script>
        function getInfo(){
            const id = document.getElementById("postID").value;

            document.getElementById("error").textContent =""
            document.getElementById("Body").textContent =""
            document.getElementById("Title").textContent =""
            if (isNaN(id) || id<1 || id>100) {
                document.getElementById("error").textContent = "!유효한 숫자 아이디를 입력해주세요";
                return;
            }

            fetch("https://jsonplaceholder.typicode.com/posts/"+id)    //url받아오기- id를 동적으로 받는다
                .then(response => response.json())                      // 응답 객체(response)를 JSON 형식의 자바스크립트 객체로 변환
                .then(data => {                                         // 변환된 데이터를 받아서 다음 작업을 진행
                    document.getElementById("Title").textContent = data.title;
                    document.getElementById("Body").textContent = data.body;
                })
                
                .catch(error => console.log("error"))
        }
    </script>
</body>
</html>
